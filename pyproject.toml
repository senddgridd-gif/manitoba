[project]
name = "mb-curriculum-scraper"
version = "0.1.0"
description = "Manitoba Legacy Curriculum Scraper"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
